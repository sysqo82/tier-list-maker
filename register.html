<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - Tier List Maker</title>
  <link rel="icon" type="image/png" href="./favicon.png" />
  <link rel="apple-touch-icon" href="./favicon.png" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="auth-page">
    <form id="register-form" class="auth-card">
      <h1>Register</h1>
      <input id="email" type="email" placeholder="Email" required autocomplete="email" />
      <input id="password" type="password" placeholder="Password" required autocomplete="new-password" />
      <label class="toggle-pass"><input id="show-password" type="checkbox" /> Show password</label>
      <p class="muted">Password: at least 8 chars, one uppercase letter, one symbol.</p>
      <button type="submit">Create Account</button>
      <p id="error" class="error"></p>
      <p class="muted">Already have an account? <a href="./login.html">Login</a></p>
    </form>
  </main>
  <script type="module" src="./register.js"></script>
</body>
</html>
