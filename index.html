<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tier List Maker</title>
  <link rel="icon" type="image/png" href="./favicon.png" />
  <link rel="apple-touch-icon" href="./favicon.png" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app">
    <section class="controls">
      <div class="inline account-row">
        <span id="user-email" class="pill"></span>
        <button type="button" id="logout-btn">Logout</button>
      </div>

      <form id="list-controls" class="inline">
        <select id="saved-list-select"></select>
        <input id="saved-list-name" type="text" placeholder="Tier list name" maxlength="80" required />
        <button type="button" id="new-list-btn">New List</button>
        <button type="button" id="save-list-btn">Save List</button>
        <button type="button" id="delete-list-btn">Delete List</button>
      </form>

      <div class="inline">
        <input type="file" id="image-upload" multiple accept="image/*" style="display:none;" />
        <button type="button" id="upload-btn">Upload Images</button>
        <button type="button" id="export-btn">Export PNG</button>
        <button type="button" id="reset-btn">Reset All</button>
      </div>
    </section>

    <section id="tier-list" class="tier-list"></section>

    <section id="tray-container">
      <div class="tray-header">Image Tray</div>
      <div id="image-tray" class="tier-zone" data-tier-id="tray"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
